<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report · Requirements Cockpit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232a78d6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 16v-2.5l2-4.6C5.4 8 6.2 7.5 7.2 7.5h9.6c1 0 1.8.5 2.2 1.4l2 4.6V16'/%3E%3Ccircle cx='7' cy='16.5' r='2'/%3E%3Ccircle cx='17' cy='16.5' r='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #e9e9e4; }
    .print-bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; align-items: center; padding: 10px; background: rgba(252, 252, 251, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .doc { width: min(920px, calc(100% - 32px)); margin: 24px auto 60px; background: #fff; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); padding: 44px 52px; animation: fade-up 0.5s var(--ease) both; }
    .doc-head { display: flex; justify-content: space-between; gap: 20px; border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 18px; }
    .doc-head .kicker { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; color: var(--ink-2); }
    .doc-head h1 { font-size: 26px; margin: 4px 0; letter-spacing: -0.02em; }
    .doc-meta { text-align: right; font-size: 12px; color: var(--ink-2); }
    .doc h2 { font-size: 16px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--grid); display: flex; gap: 8px; align-items: center; }
    .doc h3 { font-size: 14px; margin: 14px 0 6px; }
    .doc table { font-size: 12px; }
    .doc td, .doc th { padding: 6px 8px; }
    .blk { break-inside: avoid; }
    .kgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .kgrid .kpi { box-shadow: none; padding: 10px 12px; }
    .verdict-r { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; color: #fff; margin: 4px 0 14px; }
    .verdict-r b { font-size: 20px; display: block; }
    .req-item { border: 1px solid var(--grid); border-radius: 10px; padding: 14px 16px; margin: 12px 0; break-inside: avoid; }
    .req-item .rh { display: flex; gap: 12px; align-items: center; }
    .qbox { border-left: 3px solid var(--axis); padding: 4px 10px; margin: 6px 0; font-size: 12.5px; color: var(--ink-2); }
    .doc-foot { margin-top: 30px; padding-top: 10px; border-top: 1px solid var(--grid); font-size: 11px; color: var(--muted); }
    .doc .stage { border-radius: 12px; }
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; }
      .print-bar { display: none; }
      .doc { width: auto; margin: 0; padding: 0; box-shadow: none; border-radius: 0; animation: none; }
      .car .car-line, .car .car-body, .car .car-glass { animation: none !important; stroke-dashoffset: 0 !important; fill-opacity: 1 !important; }
      .hs-pulse, .zone-glow { display: none; }
      a { color: inherit; text-decoration: none; }
      h2 { break-after: avoid; }
    }
    @media (max-width: 700px) { .doc { padding: 24px 18px; } .kgrid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="print-bar">
    <button class="btn primary" id="print">Save as PDF / Print</button>
    <button class="btn" id="close">Close</button>
    <span class="muted small">Tip: choose “Save as PDF” as the printer.</span>
  </div>
  <article class="doc" id="doc"><p class="loading">Building the report…</p></article>
  <script src="common.js"></script>
  <script src="car.js"></script>
  <script src="report.js"></script>
</body>
</html>
